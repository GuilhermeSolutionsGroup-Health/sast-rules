      behalf of other users, keep the parameter but gate it with an explicit check such as
      `@PreAuthorize("hasRole('ADMIN') or #userId == authentication.name")`. Never trust a user,
      account, customer or tenant ID sent by the client as proof of who the caller is.
    shortDescription: Identity taken from client-controlled input
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
