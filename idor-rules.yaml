# yamllint disable
# Boost IDOR / broken-access-control ruleset.
#
# Semgrep-format rules in the same layout as the boost-community/sast-rules aggregate.
# Rule id convention: <language>_idor_rule-<Name>.
# Languages: csharp, java, javascript/typescript, python, go, php.
#
# Most rules are audit-level (subcategory: audit). IDOR is an authorization-logic flaw, so SAST can only
# surface candidates; confirm with authenticated multi-user DAST (Burp Autorize/AuthMatrix) or tests.
# Each rule was validated with `semgrep --test` against vulnerable and safe fixtures (see the tests bundle).
# Add a `license` field to metadata if your Boost aggregation requires one.
# yamllint enable

rules:
- id: csharp_idor_rule-OptionalOwnershipParameter
  severity: ERROR
  languages:
  - csharp
  message: Action parameter '$P' identifies or verifies the record owner but defaults to null, so a caller can omit
    it and skip the ownership check. Make the parameter required and validate it before any data lookup.
  metadata:
    help: |-
      Consider making the parameter required by removing the `= null` default and rejecting the
      request (400/403) when it is missing or does not match the record. Do this check before any data
      lookup, not only when the value is provided. Better still, do not accept the owner from the
      client at all: read it from `User.FindFirstValue(ClaimTypes.NameIdentifier)` and scope the query
      to it, for example `db.Bookings.Where(b => b.Id == id && b.OwnerId == userId)`. For
      secondary-factor checks (such as last name on a PNR lookup), use a constant-time comparison
      (`CryptographicOperations.FixedTimeEquals`) and rate limit the endpoint.
    shortDescription: Optional ownership/verification parameter
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - csharp
    - dotnet
    - webapi
    - aspnetcore
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
  patterns:
  - pattern: |
      public $RET $METHOD(..., string $P = null, ...)
      {
        ...
      }
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^(l|last)?_?name$|^surname$|^owner_?id$|^user_?id$|^account_?id$|^customer_?id$|^tenant_?id$
- id: csharp_idor_rule-LookupWithoutOwnershipCheck
  severity: WARNING
  languages:
  - csharp
  message: Client-supplied identifier '$ID' is used for a record lookup and the action never consults the caller's
    identity or runs a verification call first. Scope the query to the caller (WHERE id = @id AND owner = @user),
    use resource-based authorization, or verify a secondary factor before returning data.
  metadata:
    help: |-
      Verify that the authenticated caller may access the record before returning or changing it.
      Scope the query to the caller, for example `db.Orders.FirstOrDefault(o => o.Id == id &&
      o.OwnerId == User.FindFirstValue(ClaimTypes.NameIdentifier))`, and return 404 when nothing
      matches. For more complex ownership rules, use ASP.NET Core resource-based authorization: load
      the resource, call `await _authorizationService.AuthorizeAsync(User, resource, "SameOwner")` and
      return `Forbid()` on failure. If the endpoint is intentionally public (for example a lookup by
      record locator plus last name), verify that second factor before the lookup and rate limit the
      endpoint. This rule flags candidates: confirm by requesting another user's record with a second
      test account and checking that it is refused.
    shortDescription: Object lookup by client-supplied ID without ownership check
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - csharp
    - dotnet
    - webapi
    - aspnetcore
    - entityframework
    confidence: LOW
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-inside: |
      public $RET $METHOD(..., $T $ID, ...)
      {
        ...
      }
  - metavariable-regex:
      metavariable: $ID
      regex: (?i)^(?!(user|owner|customer|account|tenant|member|profile)_?id$)(\w*_?id|pk|uuid|guid|locator|recordlocator|reservationnumber)$
  - pattern-either:
    - patterns:
      - pattern: $X.$GET($ID, ...)
      - metavariable-regex:
          metavariable: $GET
          regex: ^(Get|Find|Load|Fetch|Read|Retrieve)\w*$
    - pattern: $CTX.$SET.Find($ID)
    - pattern: $CTX.$SET.FindAsync($ID)
    - pattern: $Q.FirstOrDefault($P => $P.$F == $ID)
    - pattern: $Q.FirstOrDefaultAsync($P => $P.$F == $ID)
    - pattern: $Q.SingleOrDefault($P => $P.$F == $ID)
    - pattern: $Q.SingleOrDefaultAsync($P => $P.$F == $ID)
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.FindFirst(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.FindFirstValue(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.IsInRole(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        var $ME = User.Identity.$NN;
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        $S.AuthorizeAsync(...);
        ...
      }
  - pattern-not-inside: |
      if (!$V(..., $ID, ...)) { ... }
      ...
- id: csharp_idor_rule-ClientSuppliedIdentity
  severity: WARNING
  languages:
  - csharp
  message: The caller's identity ('$U') is taken from a request parameter and used to load data. Any client can
    send another user's value. Derive the identity from the authenticated principal (User.FindFirst / HttpContext.User).
  metadata:
    help: |-
      Consider removing the identity parameter from the action and deriving it from the authenticated
      principal instead, for example `var userId = User.FindFirstValue(ClaimTypes.NameIdentifier);`.
      If administrators legitimately act on behalf of other users, keep the parameter but gate it with
      an explicit role or policy check (`[Authorize(Roles = "Admin")]` or `AuthorizeAsync`) and fall
      back to the caller's own ID for everyone else. Never trust a user, account, customer or tenant
      ID sent by the client as proof of who the caller is.
    shortDescription: Identity taken from client-controlled input
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - csharp
    - dotnet
    - webapi
    - aspnetcore
    confidence: LOW
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-inside: |
      public $RET $METHOD(..., $T $U, ...)
      {
        ...
      }
  - metavariable-regex:
      metavariable: $U
      regex: (?i)^(user_?id|owner_?id|customer_?id|account_?id|tenant_?id|member_?id|profile_?id)$
  - pattern: $X.$OP(..., $U, ...)
  - metavariable-regex:
      metavariable: $OP
      regex: ^(Get|Find|Load|Fetch|Read|Delete|Update|Remove|Save)\w*$
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.FindFirst(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.FindFirstValue(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        User.IsInRole(...);
        ...
      }
  - pattern-not-inside: |
      public $RET $M(...)
      {
        ...
        var $ME = User.Identity.$NN;
        ...
      }
- id: csharp_idor_rule-ForwardedForTrusted
  severity: WARNING
  languages:
  - csharp
  message: X-Forwarded-For is client-controlled. Using it for rate limiting, lockout or allow-listing lets an attacker
    rotate the header to bypass the control. Only trust it from a known proxy (ForwardedHeadersOptions.KnownProxies).
  metadata:
    help: |-
      Consider using `HttpContext.Connection.RemoteIpAddress` together with the `ForwardedHeaders`
      middleware instead of reading the header directly. Configure `ForwardedHeadersOptions` with
      `KnownProxies` or `KnownNetworks` set to your load balancers so only their values are trusted,
      and set `ForwardLimit` to the number of proxy hops. If you must parse the header yourself, take
      the right-most address that does not belong to a trusted proxy, never the first one. Do not use
      the client IP as the only key for rate limiting, lockout or allow-listing; combine it with the
      account or session identifier.
    shortDescription: Client IP taken from spoofable header
    cwe: CWE-348
    owasp:
    - A07:2021 - Identification and Authentication Failures
    category: security
    technology:
    - csharp
    - dotnet
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - audit
    references:
    - https://cwe.mitre.org/data/definitions/348.html
  pattern-either:
  - pattern: $R.Headers["X-Forwarded-For"]
  - pattern: $R.Headers.GetValues("X-Forwarded-For")
  - pattern: $R.ServerVariables["HTTP_X_FORWARDED_FOR"]
- id: csharp_idor_rule-EmptyCatchBlock
  severity: WARNING
  languages:
  - csharp
  message: Empty catch block swallows the error. When it wraps a configuration, feature-flag or authorization lookup,
    a failure silently falls back to the insecure default. Log and fail closed.
  metadata:
    help: |-
      Consider logging the exception (for example `_logger.LogError(ex, "...")`) and handling it
      explicitly. When the try block reads configuration, a feature flag or an authorization decision,
      fail closed: deny the request or rethrow instead of continuing with a default that disables the
      check. Catch only the exception types you expect rather than `Exception`. If ignoring the error
      really is correct, add a comment explaining why so reviewers can tell it is intentional.
    shortDescription: Swallowed exception
    cwe: CWE-390
    owasp:
    - A09:2021 - Security Logging and Monitoring Failures
    category: security
    technology:
    - csharp
    - dotnet
    confidence: HIGH
    likelihood: LOW
    impact: MEDIUM
    subcategory:
    - audit
    references:
    - https://cwe.mitre.org/data/definitions/390.html
  pattern: |
    try { ... } catch ($T $E) { }
- id: java_idor_rule-LookupWithoutOwnershipCheck
  severity: WARNING
  languages:
  - java
  message: Client-supplied identifier is used to load a record, and this handler never consults the caller's identity
    or runs a verification call first. Scope the query to the caller (WHERE id = ? AND owner = ?), apply resource-level
    authorization, or verify a secondary factor before returning data.
  metadata:
    help: |-
      Verify that the authenticated caller may access the record before returning or changing it.
      Scope the repository query to the caller, for example `orderRepository.findByIdAndOwnerId(id,
      principal.getName())`, and return 404 when nothing matches. With Spring Security you can also
      use method security, such as `@PreAuthorize("@orderSecurity.isOwner(#id, authentication)")` or
      `@PostAuthorize("returnObject.ownerId == authentication.name")`. If the endpoint is
      intentionally public (for example a lookup by record locator plus last name), verify that second
      factor before the lookup and rate limit the endpoint. This rule flags candidates: confirm by
      requesting another user's record with a second test account and checking that it is refused.
    shortDescription: Object lookup by client-supplied ID without ownership check
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - java
    - spring
    - jaxrs
    confidence: LOW
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-either:
    - pattern-inside: |
        $RET $M(..., @PathVariable $T $ID, ...) { ... }
    - pattern-inside: |
        $RET $M(..., @PathVariable(...) $T $ID, ...) { ... }
    - pattern-inside: |
        $RET $M(..., @RequestParam $T $ID, ...) { ... }
    - pattern-inside: |
        $RET $M(..., @RequestParam(...) $T $ID, ...) { ... }
    - pattern-inside: |
        $RET $M(..., @PathParam(...) $T $ID, ...) { ... }
    - pattern-inside: |
        $RET $M(..., @QueryParam(...) $T $ID, ...) { ... }
  - metavariable-regex:
      metavariable: $ID
      regex: (?i)^[\"']?\$?(?!(user|owner|customer|account|tenant|member|profile)_?id[\"']?$)(\w*_?id|pk|uuid|guid|locator|recordlocator|reservationnumber)[\"']?$
  - pattern-either:
    - pattern: $R.findById($ID)
    - pattern: $R.getById($ID)
    - pattern: $R.getOne($ID)
    - pattern: $R.getReferenceById($ID)
    - pattern: $EM.find($CLS.class, $ID)
  - pattern-not-inside: |
      $RT $MM(..., Principal $PR, ...) { ... }
  - pattern-not-inside: |
      $RT $MM(..., Authentication $AU, ...) { ... }
  - pattern-not-inside: |
      $RT $MM(..., @AuthenticationPrincipal $TT $UU, ...) { ... }
  - pattern-not-inside: |
      @PreAuthorize(...)
      $RT $MM(...) { ... }
  - pattern-not-inside: |
      @PostAuthorize(...)
      $RT $MM(...) { ... }
  - pattern-not-inside: |
      $RT $MM(...) {
        ...
        SecurityContextHolder.getContext();
        ...
      }
  - pattern-not-inside: |
      $RT $MM(...) {
        ...
        $REQ.getUserPrincipal();
        ...
      }
  - pattern-not-inside: |
      if (!$V(..., $ID, ...)) { ... }
      ...
- id: java_idor_rule-OptionalOwnershipParameter
  severity: ERROR
  languages:
  - java
  message: A parameter that identifies or verifies the record owner is optional, so a caller can omit it and skip
    the ownership check. Make it required and validate it before any data lookup; never validate it only 'if provided'.
  metadata:
    help: |-
      Consider making the parameter required (`@RequestParam(required = true)`, or `@NotNull` on a
      JAX-RS `@QueryParam`) and rejecting the request when it is missing or does not match the record.
      Do this check before any data lookup, not inside an `if (param != null)` block that is skipped
      when the value is absent. Better still, do not accept the owner from the client at all: take it
      from `Principal` or `@AuthenticationPrincipal` and scope the query to it. For secondary-factor
      checks (such as last name on a PNR lookup), compare with `MessageDigest.isEqual` and rate limit
      the endpoint.
    shortDescription: Optional ownership/verification parameter
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - java
    - spring
    - jaxrs
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-either:
    - pattern: |
        $RET $M(..., @RequestParam(..., required = false, ...) $T $P, ...) { ... }
    - pattern: |
        $RET $M(..., @RequestParam(..., required = false, ...) Optional<$T> $P, ...) { ... }
    - pattern: |
        $RET $M(..., @QueryParam(...) $T $P, ...) { ... }
    - pattern: |
        $RET $M(..., @RequestParam(..., defaultValue = $D, ...) $T $P, ...) { ... }
    - pattern: |
        if ($P != null) { ... }
  - metavariable-regex:
      metavariable: $P
      regex: (?i)^[\"']?\$?((l|last)_?name|surname|owner_?id|user_?id|account_?id|customer_?id|tenant_?id)[\"']?$
- id: java_idor_rule-ClientSuppliedIdentity
  severity: WARNING
  languages:
  - java
  message: The caller's identity is taken from a request parameter and used to load or change data. Any client can
    send another user's value. Derive the identity from the authenticated session or principal instead.
  metadata:
    help: |-
      Consider removing the identity parameter from the handler and deriving it from the authenticated
      principal: add a `Principal`, `Authentication` or `@AuthenticationPrincipal` argument, or read
