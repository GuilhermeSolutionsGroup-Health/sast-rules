    - audit
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-inside: |
      $RET $M(..., $T $U, ...) { ... }
  - metavariable-regex:
      metavariable: $U
      regex: (?i)^[\"']?\$?(user_?id|owner_?id|customer_?id|account_?id|tenant_?id|member_?id|profile_?id)[\"']?$
  - pattern: $X.$OP(..., $U, ...)
  - metavariable-regex:
      metavariable: $OP
      regex: ^(get|find|load|fetch|read|delete|update|remove|save|select|query)\w*$
  - pattern-not-inside: |
      $RT $MM(..., Principal $PR, ...) { ... }
  - pattern-not-inside: |
