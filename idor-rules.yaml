      $RT $MM(...) {
        ...
        $REQ.getUserPrincipal();
        ...
      }
- id: java_idor_rule-ForwardedForTrusted
  severity: WARNING
  languages:
  - java
  message: X-Forwarded-For is client-controlled. Using it for rate limiting, lockout or allow-listing lets an attacker
    rotate the header to bypass the control. Trust it only when set by a known proxy and take the right-most untrusted
    hop.
  metadata:
    help: |-
      Consider using `request.getRemoteAddr()` with your server's proxy handling instead of reading
      the header directly: in Spring Boot set `server.forward-headers-strategy=native` and configure
      Tomcat's `RemoteIpValve` `internal-proxies` to your load balancers, or use
      `ForwardedHeaderFilter` only behind a proxy that overwrites the header. If you must parse the
      header yourself, take the right-most address that does not belong to a trusted proxy, never the
      first one. Do not use the client IP as the only key for rate limiting, lockout or allow-listing;
      combine it with the account or session identifier.
    shortDescription: Client IP taken from spoofable header
    cwe: CWE-348
    owasp:
    - A07:2021 - Identification and Authentication Failures
    category: security
    technology:
    - java
    - spring
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    subcategory:
    - audit
    references:
    - https://cwe.mitre.org/data/definitions/348.html
  patterns:
  - pattern-either:
    - pattern: $R.getHeader($H)
    - pattern: |
        $RET $M(..., @RequestHeader($H) $T $P, ...) { ... }
  - metavariable-regex:
      metavariable: $H
      regex: (?i)^[\"']?x.forwarded.for[\"']?$|(?i)^[\"']?http_x_forwarded_for[\"']?$
- id: java_idor_rule-EmptyCatchBlock
  severity: WARNING
  languages:
  - java
  message: Error is swallowed. When this wraps a configuration, feature-flag or authorization lookup, a failure
    silently falls back to the insecure default. Log the error and fail closed.
  metadata:
    help: |-
      Consider logging the exception (for example `log.error("...", e)`) and handling it explicitly.
      When the try block reads configuration, a feature flag or an authorization decision, fail
      closed: deny the request or rethrow instead of continuing with a default that disables the
      check. Catch only the exception types you expect rather than `Exception` or `Throwable`. If
      ignoring the error really is correct, name the variable `ignored` and add a comment explaining
      why.
    shortDescription: Swallowed exception
    cwe: CWE-390
    owasp:
    - A09:2021 - Security Logging and Monitoring Failures
    category: security
    technology:
    - java
    confidence: HIGH
    likelihood: LOW
    impact: MEDIUM
    subcategory:
    - audit
    references:
    - https://cwe.mitre.org/data/definitions/390.html
  pattern: |
    try { ... } catch ($T $E) { }
- id: javascript_idor_rule-LookupWithoutOwnershipCheck
  severity: WARNING
  languages:
  - javascript
  - typescript
  message: Client-supplied identifier is used to load a record, and this handler never consults the caller's identity
    or runs a verification call first. Scope the query to the caller (WHERE id = ? AND owner = ?), apply resource-level
    authorization, or verify a secondary factor before returning data.
  metadata:
    help: |-
      Verify that the authenticated caller may access the record before returning or changing it.
      Scope the query to the caller, for example `Order.findOne({ _id: req.params.id, ownerId:
      req.user.id })` (Mongoose) or `findOne({ where: { id: req.params.id, ownerId: req.user.id } })`
      (Sequelize, Prisma, TypeORM), and return 404 when nothing matches. For more complex rules, use
      an authorization middleware or a policy library such as CASL that loads the resource and checks
      it before the handler runs. If the endpoint is intentionally public (for example a lookup by
      record locator plus last name), verify that second factor before the lookup and rate limit the
      endpoint. This rule flags candidates: confirm by requesting another user's record with a second
      test account and checking that it is refused.
    shortDescription: Object lookup by client-supplied ID without ownership check
    cwe: CWE-639
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - javascript
    - typescript
    - express
    - nodejs
    confidence: LOW
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
    - https://cwe.mitre.org/data/definitions/639.html
  patterns:
  - pattern-either:
    - pattern: $M.findById($REQ.$W.$X)
    - pattern: $M.findByPk($REQ.$W.$X)
    - pattern: '$M.findOne({ _id: $REQ.$W.$X })'
    - pattern: '$M.findOne({ where: { id: $REQ.$W.$X } })'
    - pattern: '$M.findUnique({ where: { id: $REQ.$W.$X } })'
    - pattern: '$M.findOneBy({ id: $REQ.$W.$X })'
    - pattern: '$M.destroy({ where: { id: $REQ.$W.$X } })'
    - pattern: $M.findByIdAndDelete($REQ.$W.$X)
    - pattern: $M.findByIdAndUpdate($REQ.$W.$X, ...)
  - metavariable-regex:
      metavariable: $W
      regex: ^(params|query)$
  - metavariable-regex:
      metavariable: $X
      regex: (?i)^[\"']?\$?(?!(user|owner|customer|account|tenant|member|profile)_?id[\"']?$)(\w*_?id|pk|uuid|guid|locator|recordlocator|reservationnumber)[\"']?$
  - pattern-not-inside: |
      ($REQ, ...) => { ... $REQ.user; ... }
  - pattern-not-inside: |
      function ($REQ, ...) { ... $REQ.user; ... }
  - pattern-not-inside: |
      function $F($REQ, ...) { ... $REQ.user; ... }
  - pattern-not-inside: |
      async function $F($REQ, ...) { ... $REQ.user; ... }
  - pattern-not-inside: |
      async ($REQ, ...) => { ... $REQ.user; ... }
  - pattern-not-inside: |
      ($REQ, ...) => { ... $REQ.session; ... }
  - pattern-not-inside: |
      function ($REQ, ...) { ... $REQ.session; ... }
- id: javascript_idor_rule-NestLookupWithoutOwnershipCheck
  severity: WARNING
  languages:
  - typescript
  message: Client-supplied identifier is used to load a record, and this handler never consults the caller's identity
    or runs a verification call first. Scope the query to the caller (WHERE id = ? AND owner = ?), apply resource-level
    authorization, or verify a secondary factor before returning data.
  metadata:
    help: |-
      Verify that the authenticated caller may access the record before returning or changing it.
      Inject the current user into the handler (`@Req()` or a custom `@CurrentUser()` decorator), pass
      it to the service and scope the query, for example `this.repo.findOneBy({ id, ownerId: user.id
      })`, throwing `NotFoundException` when nothing matches. For reusable rules, implement a guard
      (`CanActivate`) or use CASL abilities to authorize the loaded resource. If the endpoint is
      intentionally public (for example a lookup by record locator plus last name), verify that second
      factor before the lookup and rate limit the endpoint. This rule flags candidates: confirm by
